<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 940 304' width='940' height='304' role='img'><title>Work, skew and hop for each phase</title><defs><marker id='ah' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#52514e'/></marker></defs><rect width='940' height='304' fill='#fcfcfb' rx='8'/><text x='24' y='32' font-size='16' fill='#0b0b0b' text-anchor='start' font-weight='bold' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif'>Where the time of a layer goes, for each phase</text><text x='24' y='54' font-size='12' fill='#52514e' text-anchor='start' font-weight='normal' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif'>Median over 148 CTAs and 28 layers, ns. Work = exit to arrive end. Skew = last arrive minus median arrive. Hop = last arrive to the next exit.</text><text x='24' y='109' font-size='13' fill='#0b0b0b' text-anchor='start' font-weight='bold' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif'>Q</text><rect x='60' y='92' width='238.7' height='26' rx='3' fill='#2a78d6'/><text x='180.37037037037038' y='109' font-size='11.5' fill='#ffffff' text-anchor='middle' font-weight='normal' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif'>1248</text><rect x='300.7' y='92' width='32.0' height='26' rx='3' fill='#1baf7a'/><rect x='334.7' y='92' width='244.9' height='26' rx='3' fill='#eb6834'/><text x='458.14814814814815' y='109' font-size='11.5' fill='#ffffff' text-anchor='middle' font-weight='normal' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif'>1280</text><text x='587.604938271605' y='109' font-size='12' fill='#0b0b0b' text-anchor='start' font-weight='normal' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif'>2704</text><text x='24' y='151' font-size='13' fill='#0b0b0b' text-anchor='start' font-weight='bold' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif'>F</text><rect x='60' y='134