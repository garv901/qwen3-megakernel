<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 980 322' width='980' height='322' role='img'><title>Decode step overview</title><defs><marker id='ah' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#52514e'/></marker></defs><rect width='980' height='322' fill='#fcfcfb' rx='8'/><text x='24' y='34' font-size='17' fill='#0b0b0b' text-anchor='start' font-weight='bold' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif'>One decode step = one cooperative kernel launch</text><text x='24' y='56' font-size='12.5' fill='#52514e' text-anchor='start' font-weight='normal' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif'>148 CTAs x 512 threads, one CTA on each SM of the B200. Static work schedule: each CTA owns fixed rows in each phase.</text><rect x='24' y='104' width='92' height='66' rx='4' fill='#f3f2ef' stroke='#e4e3df' stroke-width='1.5'/><text x='70' y='134' font-size='12.5' fill='#0b0b0b' text-anchor='middle' font-weight='normal' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif'>prologue</text><text x='70' y='151' font-size='11' fill='#52514e' text-anchor='middle' font-weight='normal' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif'>embed row</text><rect x='132' y='88' width='620' height='98' rx='8' fill='none' stroke='#52514e' stroke-width='1.2' stroke-dasharray='5 4'/><text x='742' y='82' font-size='12.5' fill='#52514e' text-anchor='end' font-weight='bold' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif'>x 28 layers</text><rect x='148' y='104' width='126' height='66' rx='5' fill='#2a78d6'/><text x='211' y='124' font-size='14' fill='#ffffff' text-anchor='middle' font-weight='bold' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif'>Q</text><text x='211' y='142' font-size='11' fill='#ffffff' text-anchor='middle' font-weight='normal' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif'>RMSNorm + QKV</text><text x='211' y='159' font-size='10.5' fill='#ffffff' text-anchor='middle' font-weight='normal' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif'>4096 x 1024</text><rect x='278' y='98' width='6' height='78' rx='2' fill='#eb6834'/><rect x='288' y='104' width='126' height='66' rx='5' fill='#2a78d6'/><text x='351' y='124' font-size='14' fill='#ffffff' text-anchor='middle' font-weight='bold' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif'>F</text><text x='351' y='142' font-size='11' fill='#ffffff' text-anchor='middle' font-weight='normal' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif'>attention + O-proj</text><text x='351' y='159' font-size='10.5' fill='#ffffff' text-anchor='middle' font-weight='normal' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif'>Wo 1024 x 2048</text><rect x='418' y='98' width='6' height='78' rx='2' fill='#eb6834'/><rect x='428' y='104' width='126' height='66' rx='5' fill='#2a78d6'/><text x='491' y='124' font-size='14' fill='#ffffff' text-anchor='middle' font-weight='bold' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif'>G</text><text x='491' y='142' font-size='11' fill='#ffffff' text-anchor='middle' font-weight='normal' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif'>gate/up + SiLU</text><text x='491' y='159' font-size='10.5' fill='#ffffff' text-anchor='middle' font-weight='normal' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif'>6144 x 1024</text><rect x='558' y='98' width='6' height='78' rx='2' fill='#eb6834'/><rect x='568' y='104' width='126' height='66' rx='5' fill='#2a78d6'/><text x='631' y='124' font-size='14' fill='#ffffff' text-anchor='middle' font-weight='bold' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif'>D</text><text x='631' y='142' font-size='11' fill='#ffffff' text-anchor='middle' font-weight='normal' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif'>down</text><text x='631' y='159' font-size='10.5' fill='#ffffff' text-anchor='middle' font-weight='normal' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif'>1024 x 3072</text><rect x='698' y='98' width='6' height='78' rx='2' fill='#eb6834'/><rect x='118' y='98' width='6' height='78' rx='2' fill='#eb6834'/><rect x='770' y='104' width='186' height='66' rx='5' fill='#1baf7a'/><text x='863' y='132' font-size='12.5' fill='#ffffff' text-anchor='middle' font-weight='bold' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif'>LM head + argmax</text><text x='863' y='150' font-size='11' fill='#ffffff' text-anchor='middle' font-weight='normal' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif'>151936 x 1024 (311 MB)</text><line x1='752' y1='137.0' x2='768' y2='137.0' stroke='#52514e' stroke-width='1.5' marker-end='url(#ah)'/><text x='24' y='222' font-size='12.5' fill='#0b0b0b' text-anchor='start' font-weight='normal' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif'>Each orange bar is a grid barrier: 1 + 4 x 28 = 113 per step.</text><text x='24' y='242' font-size='12.5' fill='#52514e' text-anchor='start' font-weight='normal' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif'>A barrier is needed where a phase reads data that all 148 CTAs wrote (RMSNorm needs the full x, each down row needs all of hid).</text><text x='24' y='262' font-size='12.5' fill='#52514e' text-anchor='start' font-weight='normal' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif'>Activations stay in fp32. Weights are bf16. The weight bytes per step are 1.21 GB, so the HBM floor at 8 TB/s is about 151 us.</text><rect x='24' y='292' width='12' height='12' rx='3' fill='#2a78d6'/><text x='42' y='302' font-size='12' fill='#52514e' text-anchor='start' font-weight='normal' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif'>phase work</text><rect x='122.0' y='292' width='12' height='12' rx='3' fill='#eb6834'/><text x='140.0' y='302' font-size='12' fill='#52514e' text-anchor='start' font-weight='normal' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif'>grid barrier</text><rect x='234.4' y='292' width='12' height='12' rx='3' fill='#1baf7a'/><text x='252.4' y='302' font-size='12' fill='#52514e' text-anchor='start' font-weight='normal' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif'>LM head (bandwidth bound)</text></svg>
