ght='20' rx='3' fill='#3987e5'/><rect x='671' y='285' width='22' height='20' rx='3' fill='#3987e5'/><rect x='695' y='285' width='22' height='20' rx='3' fill='#3987e5'/><rect x='719' y='285' width='22' height='20' rx='3' fill='#3987e5'/><rect x='743' y='285' width='22' height='20' rx='3' fill='#3987e5'/><rect x='767' y='285' width='22' height='20' rx='3' fill='#3987e5'/><rect x='791' y='285' width='22' height='20' rx='3' fill='#3987e5'/><text x='422' y='211.0' font-size='11' fill='#c3c2b7' text-anchor='end' font-weight='normal' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif'>row slice s</text><text x='422' y='225.0' font-size='11' fill='#c3c2b7' text-anchor='end' font-weight='normal' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif'>0 .. 8</text><text x='622.0' y='324' font-size='11.5' fill='#c3c2b7' text-anchor='middle' font-weight='normal' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif'>Wo (1024 x 2048) cut into 144 tiles = 144 CTAs</text><rect x='834' y='104' width='216' height='214' rx='6' fill='#242422' stroke='#e66767' stroke-width='1.5'/><text x='844' y='124' font-size='12.5' fill='#f0efec' text-anchor='start' font-weight='bold' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif'>CTA (h=5, s=3)</text><text x='844' y='146' font-size='11' fill='#f0efec' text-anchor='start' font-weight='normal' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif'>1. read q of head 5 and new k, v</text><text x='844' y='164' font-size='11' fill='#c3c2b7' text-anchor='start' font-weight='normal' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif'>   of kv head 2 (written in Q)</text><text x='844' y='182' font-size='11' fill='#f0efec' text-anchor='start' font-weight='normal' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif'>2. attention over 129 positions</text><text x='844' y='200' font-size='11' fill='#c3c2b7' text-anchor='start' font-weight='normal' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif'>   (also done by the 8 other CTAs</text><text x='844' y='218' font-size='11' fill='#c3c2b7' text-anchor='start' font-weight='normal' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif'>   of head 5)</text><text x='844' y='236' font-size='11' fill='#f0efec' text-anchor='start' font-weight='normal' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif'>3. partial = Wo[slice s, head h] . o</text><text x='844' y='254' font-size='11' fill='#c3c2b7' text-anchor='start' font-weight='normal' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif'>   (112 or 116 rows x 128 columns)</text><text x='844' y='272' font-size='11' fill='#f0efec' text-anchor='start' font-weight='normal' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif'>4. red.add partial into x</text><text x='844' y='290' font-size='11' fill='#c3c2b7' text-anchor='start' font-weight='normal' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif'>   (fp32, in L2)</text><line x1='572' y1='185.0' x2='832' y2='164' stroke='#e66767' stroke-width='1.2' stroke-dasharray='3 3'/><text x='24' y='342' font-size='12.5' fill='#f0efec' text-anchor='start' font-weight='bold' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif'>Result: 4 grid barriers per layer, not 5 (28 fewer per step). The O-proj split-K adds no weight bytes.</text><text x='24' y='362' font-size='12.5' fill='#c3c2b7' text-anchor='start' font-weight='normal' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif'>The cost: 9 copies of the attention per head. The F-phase oracles show that this compute is mostly off the critical path:</text><text x='24' y='382' font-size='12.5' fill='#c3c2b7' text-anchor='start' font-weight='normal' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif'>with all attention compute removed, the step is only 3.6 us faster.</text><rect x='24' y='404' width='12' height='12' rx='3' fill='#3987e5'/><text x='42' y='414' font-size='12' fill='#c3c2b7' text-anchor='start' font-weight='normal' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif'>CTA tile</text><rect x='107.6' y='404' width='12' height='12' rx='3' fill='#e66767'/><text x='125.6' y='414' font-size='12' fill='#c3c2b7' text-anchor='start' font-weight='normal' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif'>example CTA</text><rect x='212.8' y='404' width='12' height='12' rx='3' fill='#d95926'/><text x='230.8' y='414' font-size='12' fill='#c3c2b7' text-anchor='start' font-weight='normal' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif'>grid barrier</text></svg>
