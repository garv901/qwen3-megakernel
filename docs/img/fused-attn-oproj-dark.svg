<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1070 430' width='1070' height='430' role='img'><title>Fused attention and O-proj phase</title><defs><marker id='ah' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#c3c2b7'/></marker></defs><rect width='1070' height='430' fill='#1a1a19' rx='8'/><text x='24' y='34' font-size='17' fill='#f0efec' text-anchor='start' font-weight='bold' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif'>Attention and O-proj in one phase</text><text x='24' y='56' font-size='12.5' fill='#c3c2b7' text-anchor='start' font-weight='normal' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif'>144 of the 148 CTAs do fused work: 16 heads x 9 row slices of Wo. Each CTA computes the attention of its head again.</text><text x='24' y='86' font-size='13.5' fill='#f0efec' text-anchor='start' font-weight='bold' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif'>Two phases (not used)</text><rect x='24' y='100' width='280' height='40' rx='5' fill='#3987e5'/><text x='164' y='125' font-size='12' fill='#ffffff' text-anchor='middle' font-weight='normal' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif'>attention: 16 heads -> o (2048)</text><rect x='24' y='146' width='280' height='8' rx='2' fill='#d95926'/><text x='310' y='154' font-size='11' fill='#c3c2b7' text-anchor='start' font-weight='normal' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif'>grid barrier</text><rect x='24' y='160' width='280' height='40' rx='5' fill='#3987e5'/><text x='164' y='185' font-size='12' fill='#ffffff' text-anchor='middle' font-weight='normal' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif'>O-proj: x += Wo . o</text><rect x='24' y='206' width='280' height='8' rx='2' fill='#d95926'/><text x='24' y='238' font-size='12' fill='#c3c2b7' text-anchor='start' font-weight='normal' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif'>5 grid barriers per layer.</text><text x='24' y='256' font-size='12' fill='#c3c2b7' text-anchor='start' font-weight='normal' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif'>o makes a round trip through L2.</text><text x='430' y='86' font-size='13.5' fill='#f0efec' text-anchor='start' font-weight='bold' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif'>One fused phase (this kernel)</text><text x='622.0' y='100' font-size='11' fill='#c3c2b7' text-anchor='middle' font-weight='normal' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif'>head h = 0 .. 15  (128 Wo columns each)</text><rect x='431' y='109' width='22' height='20' rx='3' fill='#3987e5'/><rect x='455' y='109' width='22' height='20' rx='3' fill='#3987e5'/><rect x='479' y='109' width='22' height='20' rx='3' fill='#3987e5'/><rect x='503' y='109' width='22' height='20' rx='3' fill='#3987e5'/><rect x='527' y='109' width='22' height='20' rx='3' fill='#3987e5'/><rect x='551' y='109' width='22' height='20' rx='3' fill='#3987e5'/><rect x='575' y='109' width='22' height='20' rx='3' fill='#3987e5'/><rect x='599' y='109' width='22' height='20' rx='3' fill='#3987e5'/><rect x='623' y='109' width='22' height='20' rx='3' fill='#3987e5'/><rect x='647' y='109' width='22' height='20' rx='3' fill='#3987e5'/><rect x='671' y='109' width='22' height='20' rx='3' fill='#3987e5'/><rect x='695' y='109' width='22' height='20' rx='3' fill='#3987e5'/><rect x='719' y='109' width='22' height='20' rx='3' fill='#3987e5'/><rect x='743' y='109' width='22' height='20' rx='3' fill='#3987e5'/><rect x='767' y='109' width='22' height='20' rx='3' fill='#3987e5'/><rect x='791' y='109' width='22' height='20' rx='3' fill='#3987e5'/><rect x='431' y='131' width='22' height='20' rx='3' fill='#3987e5'/><rect x='455' y='131' width='22' height='20' rx='3' fill='#3987e5'/><rect x='479' y='131' width='22' height='20' rx='3' fill='#3987e5'/><rect x='503' y='131' width='22' height='20' rx='3' fill='#3