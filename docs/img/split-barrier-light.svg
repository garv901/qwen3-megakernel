<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 980 470' width='980' height='470' role='img'><title>Split-phase grid barrier</title><defs><marker id='ah' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#52514e'/></marker></defs><rect width='980' height='470' fill='#fcfcfb' rx='8'/><text x='24' y='34' font-size='17' fill='#0b0b0b' text-anchor='start' font-weight='bold' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif'>Split-phase grid barrier: arrive, overlap, wait</text><text x='24' y='56' font-size='12.5' fill='#52514e' text-anchor='start' font-weight='normal' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif'>One CTA, one hop from phase N to phase N+1. Not to scale.</text><text x='24' y='114' font-size='12.5' fill='#0b0b0b' text-anchor='start' font-weight='bold' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif'>warp 0 (thread 0)</text><line x1='190' y1='130' x2='956' y2='130' stroke='#e4e3df' stroke-width='1'/><text x='24' y='174' font-size='12.5' fill='#0b0b0b' text-anchor='start' font-weight='bold' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif'>warps 1-15</text><line x1='190' y1='190' x2='956' y2='190' stroke='#e4e3df' stroke-width='1'/><text x='24' y='234' font-size='12.5' fill='#0b0b0b' text-anchor='start' font-weight='bold' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif'>TMA engine</text><line x1='190' y1='250' x2='956' y2='250' stroke='#e4e3df' stroke-width='1'/><rect x='190' y='96' width='120' height='28' rx='4' fill='#2a78d6'/><text x='250' y='115' font-size='11.5' fill='#ffffff' text-anchor='middle' font-weight='normal' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif'>phase N work</text><rect x='190' y='156' width='120' height='28' rx='4' fill='#2a78d6'/><text x='250' y='175' font-size='11.5' fill='#ffffff' text-anchor='middle' font-weight='normal' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif'>phase N work</text><rect x='316' y='90' width='7' height='100' rx='2' fill='#eb6834'/><text x='319' y='82' font-size='10.5' fill='#52514e' text-anchor='middle' font-weight='normal' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif'>__syncthreads</text><rect x='330' y='96' width='92' height='28' rx='4' fill='#eb6834'/><text x='376' y='114' font-size='11.5' fill='#ffffff' text-anchor='middle' font-weight='normal' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif'>fence + red</text><rect x='428' y='96' width='62' height='28' rx='4' fill='#f3f2ef' stroke='#eb6834' stroke-width='1.2'/><text x='459' y='114' font-size='11.5' fill='#0b0b0b' text-anchor='middle' font-weight='normal' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif'>spin</text><rect x='496' y='96' width='270' height='28' rx='4' fill='#f3f2ef' stroke='#eb6834' stroke-width='1.2' stroke-dasharray='4 3'/><text x='631' y='114' font-size='11.5' fill='#0b0b0b' text-anchor='middle' font-weight='normal' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif'>relaxed poll: ld.relaxed.gpu counter (L2)</text><rect x='772' y='96' width='74' height='28' rx='4' fill='#eb6834'/><text x='809' y='114' font-size='11.5' fill='#ffffff' text-anchor='middle' font-weight='normal' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif'>1 acquire</text><rect x='330' y='156' width='360' height='28' rx='4' fill='#1baf7a'/><text x='510' y='174' font-size='11.5' fill='#ffffff' text-anchor='middle' font-weight='normal' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif'>window loads: phase N+1 weights (and warp 0's share)</text><rect x='696' y='156' width='150' height='28' rx='4' fill='#f3f2ef' stroke='#e4e3df' stroke-width='1.5'/><text x='771' y='174' font-size='11.5' fill='#52514e' text-anchor='middle' font-weight='normal' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif'>wait</text><rect x='230' y='216' width='380' height='28' rx='4' fill='#6250d6'/><text x='420' y='234' font-size='11.5' fill='#ffffff' text-anchor='middle' font-weight='normal' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif'>TMA bulk copy into smem (issued in phase N, after its critical read)</text><rect x='852' y='90' width='7' height='160' rx='2' fill='#eb6834'/><text x='855' y='82' font-size='10.5' fill='#52514e' text-anchor='middle' font-weight='normal' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif'>__syncthreads</text><rect x='866' y='96' width='90' height='28' rx='4' fill='#2a78d6'/><text x='911.0' y='115' font-size='11.5' fill='#ffffff' text-anchor='middle' font-weight='normal' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif'>phase N+1</text><rect x='866' y='156' width='90' height='28' rx='4' fill='#2a78d6'/><text x='911.0' y='175' font-size='11.5' fill='#ffffff' text-anchor='middle' font-weight='normal' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif'>phase N+1</text><text x='376' y='274' font-size='12' fill='#52514e' text-anchor='middle' font-weight='bold' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif'>arrive</text><text x='606' y='274' font-size='12' fill='#52514e' text-anchor='middle' font-weight='bold' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif'>overlap window: bytes move while thread 0 waits</text><text x='855' y='274' font-size='12' fill='#52514e' text-anchor='middle' font-weight='bold' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif'>wait done</text><text x='24' y='300' font-size='13' fill='#0b0b0b' text-anchor='start' font-weight='bold' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif'>Poll loop in SASS (sm_100)</text><rect x='24' y='310' width='450' height='118' rx='6' fill='#f3f2ef'/><text x='36' y='332' font-size='12' fill='#52514e' text-anchor='start' font-weight='normal' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif'>before: acquire load in the loop</text><text x='36' y='354' font-size='12' fill='#0b0b0b' text-anchor='start' font-weight='normal' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace'>L: LDG.E.STRONG.GPU R4, [counter]</text><text x='36' y='374' font-size='12' fill='#0b0b0b' text-anchor='start' font-weight='normal' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace'>   CCTL.IVALL        // every iteration</text><text x='36' y='394' font-size='12' fill='#0b0b0b' text-anchor='start' font-weight='normal' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace'>   ISETP / @!P0 BRA L</text><rect x='500' y='310' width='456' height='118' rx='6' fill='#f3f2ef'/><text x='512' y='332' font-size='12' fill='#52514e' text-anchor='start' font-weight='normal' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif'>hv2: relaxed loop, one acquire at the end</text><text x='512' y='354' font-size='12' fill='#0b0b0b' text-anchor='start' font-weight='normal' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace'>L: LDG.E.STRONG.GPU R4, [counter]</text><text x='512' y='374' font-size='12' fill='#0b0b0b' text-anchor='start' font-weight='normal' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace'>   ISETP / @!P0 BRA L</text><text x='512' y='394' font-size='12' fill='#0b0b0b' text-anchor='start' font-weight='normal' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace'>   CCTL.IVALL        // once</text><rect x='24' y='446' width='12' height='12' rx='3' fill='#2a78d6'/><text x='42' y='456' font-size='12' fill='#52514e' text-anchor='start' font-weight='normal' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif'>work</text><rect x='78.8' y='446' width='12' height='12' rx='3' fill='#eb6834'/><text x='96.8' y='456' font-size='12' fill='#52514e' text-anchor='start' font-weight='normal' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif'>barrier protocol</text><rect x='220.0' y='446' width='12' height='12' rx='3' fill='#1baf7a'/><text x='238.0' y='456' font-size='12' fill='#52514e' text-anchor='start' font-weight='normal' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif'>weight loads</text><rect x='332.4' y='446' width='12' height='12' rx='3' fill='#6250d6'/><text x='350.4' y='456' font-size='12' fill='#52514e' text-anchor='start' font-weight='normal' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif'>TMA copy</text></svg>
